[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "csig-memory"
version = "0.1.0"
description = "LLM-extracted evidence graph for agent long-term memory"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "pydantic>=2.8,<3", "python-dotenv>=1.0,<2"]

[project.optional-dependencies]
rag = ["numpy>=1.26,<3", "sentence-transformers>=3,<6"]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["memory*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
